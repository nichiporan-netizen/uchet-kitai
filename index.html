<script>
// ================= МОЙ ПРОФИЛЬ =================
function renderMe() {
  const def = getDefaults();
  document.getElementById('me-default-rate').value = def.rate || '';
  document.getElementById('me-default-kg').value = def.kg || '';
  document.getElementById('me-pin').value = loadPin();

  const data = load();
  const t = calcTotals(data);
  document.getElementById('meGrandTotal').textContent = t.totalByn.toFixed(2)+' BYN';
  document.getElementById('meGrandSub').textContent = '¥'+t.totalYuan.toFixed(2)+' · '+t.totalWeight.toFixed(2)+' кг · '+data.length+' '+plural(data.length,'человек','человека','человек');
}

// ================= СПИСОК ЛЮДЕЙ =================
function renderPeople() {
  const data = load();
  const q = (document.getElementById('searchPeople').value || '').toLowerCase().trim();
  const filtered = q ? data.filter(p => p.name.toLowerCase().includes(q) || (p.phone||'').includes(q) || (p.telegram||'').toLowerCase().includes(q)) : data;
  const el = document.getElementById('peopleList');

  if (!data.length) { el.innerHTML = '<div class="empty">Пока никого нет.<br>Нажми ➕ Добавить человека</div>'; return; }
  if (!filtered.length) { el.innerHTML = '<div class="empty">Никого не найдено</div>'; return; }

  el.innerHTML = filtered.map(p => {
    const c = calcPerson(p);
    return `<div class="person-row ${c.status}" onclick="openPerson(${p.id})">
      <div class="avatar">${p.avatar}<span class="status-dot ${c.status}"></span></div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="sub">${c.ordersCount} ${plural(c.ordersCount,'заказ','заказа','заказов')} · ${c.weight.toFixed(2)} кг · ¥${c.yuan.toFixed(2)}</div>
      </div>
      <div class="amount">
        <div class="byn">${c.total.toFixed(2)}</div>
        <div class="y">BYN</div>
      </div>
    </div>`;
  }).join('');
}

// ================= ПРОФИЛЬ ЧЕЛОВЕКА =================
function openPerson(id) {
  const data = load();
  const p = data.find(x => x.id === id);
  if (!p) return;
  currentOrderPersonId = id;
  const c = calcPerson(p);

  let statusText = '❌ Не оплачено', statusClass = 'debt';
  if (c.status==='paid') { statusText='✅ Оплачено полностью'; statusClass='paid'; }
  else if (c.status==='partial') { statusText='⚠️ Частично оплачено'; statusClass='partial'; }

  const ordersHtml = (p.orders||[]).length ? (p.orders||[]).map(o => {
    const co = calcOrder(o);
    return `<div class="order-item">
      <div class="head">
        <div class="date">${o.date ? new Date(o.date).toLocaleDateString('ru-RU') : 'без даты'}</div>
        <div class="order-total">${co.total.toFixed(2)} BYN</div>
      </div>
      ${o.items ? `<div class="row-small">📦 ${escapeHtml(o.items)}</div>` : ''}
      <div class="row-small">⚖️ ${(o.weight||0).toFixed(2)} кг × ${o.kgrate} = ${co.deliv.toFixed(2)} BYN</div>
      <div class="row-small">💴 ¥${(o.yuan||0).toFixed(2)} × ${o.rate} = ${co.goods.toFixed(2)} BYN</div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="small ghost" onclick="editOrder(${p.id}, ${o.id})">✏️</button>
        <button class="small danger" onclick="deleteOrder(${p.id}, ${o.id})">🗑</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty" style="padding:20px;font-size:13px;">Заказов пока нет</div>';

  const paymentsHtml = (p.payments||[]).length ? (p.payments||[]).slice().reverse().map(pay => `
    <div class="payment-history-item">
      <span class="date">${new Date(pay.date).toLocaleDateString('ru-RU')}</span>
      <span class="amount">+ ${pay.amount.toFixed(2)} BYN</span>
      <button class="small ghost" style="padding:4px 8px;font-size:11px;" onclick="deletePayment(${p.id}, ${pay.id})">×</button>
    </div>
  `).join('') : '<div style="color:var(--text3);font-size:13px;text-align:center;padding:10px;">Платежей пока нет</div>';

  document.getElementById('personDetails').innerHTML = `
    <div class="profile-head">
      <div class="avatar-big">${p.avatar}</div>
      <div class="name">${escapeHtml(p.name)}</div>
      ${p.phone ? `<div class="contact">📞 ${escapeHtml(p.phone)}</div>` : ''}
      ${p.telegram ? `<div class="contact">💬 ${escapeHtml(p.telegram)}</div>` : ''}
    </div>

    <div class="total-big">
      <div class="lbl">Итого к оплате</div>
      <div class="val">${c.total.toFixed(2)} BYN</div>
    </div>

    <div class="stats-grid">
      <div class="stat weight"><span class="val">${c.weight.toFixed(2)} кг</span><span class="lbl">Вес</span></div>
      <div class="stat yuan"><span class="val">¥${c.yuan.toFixed(2)}</span><span class="lbl">Юани</span></div>
      <div class="stat goods"><span class="val">${c.goods.toFixed(2)}</span><span class="lbl">Товар BYN</span></div>
      <div class="stat deliv"><span class="val">${c.deliv.toFixed(2)}</span><span class="lbl">Доставка BYN</span></div>
    </div>

    <div class="edit-form">
      <h2>📦 Заказы (${(p.orders||[]).length})</h2>
      <button class="green" onclick="openAddOrder(${p.id})">➕ Добавить заказ</button>
      ${ordersHtml}
    </div>

    <div class="pay-block">
      <h2>💰 Оплата</h2>
      <div class="pay-status ${statusClass}">
        <span>${statusText}</span>
        <span>${c.paid.toFixed(2)} / ${c.total.toFixed(2)}</span>
      </div>
      <div class="pay-numbers">
        <div class="pay-num paid"><span class="val">${c.paid.toFixed(2)}</span><span class="lbl">Оплачено</span></div>
        <div class="pay-num remain"><span class="val">${c.remain.toFixed(2)}</span><span class="lbl">Осталось</span></div>
      </div>

      <span class="field-label">Добавить платёж (BYN)</span>
      <input id="pay-amount" type="number" step="0.01" inputmode="decimal" placeholder="например 500">
      <input id="pay-date" type="date">
      <button onclick="addPayment(${p.id})">➕ Добавить платёж</button>
      <button class="green" onclick="payFull(${p.id})">✅ Оплатить весь остаток</button>

      <h2 style="margin-top:16px;">История платежей</h2>
      ${paymentsHtml}
    </div>

    <button onclick="openEditForm(${p.id})">✏️ Редактировать контакты</button>
    <button class="danger" onclick="deletePerson(${p.id})">🗑 Удалить человека</button>
  `;

  switchScreen('person');
  document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
  const mi = document.querySelector('.menu-item[data-screen="people"]');
  if (mi) mi.classList.add('active');
}

// ================= ПЛАТЕЖИ =================
function addPayment(personId) {
  const amt = parseFloat(document.getElementById('pay-amount').value) || 0;
  const dt = document.getElementById('pay-date').value || new Date().toISOString().slice(0,10);
  if (amt <= 0) { showModal('⚠️ Ошибка','Введите сумму больше 0'); return; }
  const data = load();
  const idx = data.findIndex(p => p.id === personId);
  if (idx < 0) return;
  if (!data[idx].payments) data[idx].payments = [];
  data[idx].payments.push({ id: Date.now(), amount: amt, date: dt });
  save(data);
  openPerson(personId);
}
function payFull(personId) {
  const data = load();
  const idx = data.findIndex(p => p.id === personId);
  if (idx < 0) return;
  const c = calcPerson(data[idx]);
  if (c.remain <= 0.01) { showModal('ℹ️','Уже оплачено'); return; }
  if (!data[idx].payments) data[idx].payments = [];
  data[idx].payments.push({ id: Date.now(), amount: c.remain, date: new Date().toISOString().slice(0,10) });
  save(data);
  openPerson(personId);
}
function deletePayment(personId, payId) {
  if (!confirm('Удалить этот платёж?')) return;
  const data = load();
  const idx = data.findIndex(p => p.id === personId);
  if (idx < 0) return;
  data[idx].payments = (data[idx].payments||[]).filter(x => x.id !== payId);
  save(data);
  openPerson(personId);
}

// ================= ФОРМА ЧЕЛОВЕКА =================
function openAddForm() {
  currentPersonId = null;
  document.getElementById('formTitle').textContent = '➕ Новый человек';
  document.getElementById('formSaveBtn').textContent = '💾 Сохранить';
  document.getElementById('f-name').value = '';
  document.getElementById('f-phone').value = '';
  document.getElementById('f-telegram').value = '';
  selectedAvatar = AVATARS[0];
  renderAvatarPicker();
  switchScreen('form');
}
function openEditForm(id) {
  const p = load().find(x => x.id === id);
  if (!p) return;
  currentPersonId = id;
  document.getElementById('formTitle').textContent = '✏️ Редактировать';
  document.getElementById('formSaveBtn').textContent = '💾 Обновить';
  document.getElementById('f-name').value = p.name;
  document.getElementById('f-phone').value = p.phone || '';
  document.getElementById('f-telegram').value = p.telegram || '';
  selectedAvatar = p.avatar;
  renderAvatarPicker();
  switchScreen('form');
}
function renderAvatarPicker() {
  document.getElementById('avatarPicker').innerHTML = AVATARS.map(a =>
    `<div class="avatar-opt ${a===selectedAvatar?'selected':''}" onclick="pickAvatar('${a}')">${a}</div>`
  ).join('');
}
function pickAvatar(a) { selectedAvatar = a; renderAvatarPicker(); }

function savePerson() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const telegram = document.getElementById('f-telegram').value.trim();
  if (!name) { showModal('⚠️ Ошибка','Введите имя'); return; }
  const data = load();
  if (currentPersonId) {
    const idx = data.findIndex(p => p.id === currentPersonId);
    if (idx >= 0) data[idx] = { ...data[idx], name, phone, telegram, avatar: selectedAvatar };
  } else {
    data.push({ id: Date.now(), name, phone, telegram, avatar: selectedAvatar, orders: [], payments: [] });
  }
  save(data);
  switchScreen('people');
}
function deletePerson(id) {
  if (!confirm('Удалить человека и все его заказы?')) return;
  save(load().filter(p => p.id !== id));
  switchScreen('people');
}

// ================= ЗАКАЗЫ =================
function openAddOrder(personId) {
  currentOrderPersonId = personId;
  currentOrderId = null;
  const def = getDefaults();
  document.getElementById('orderFormTitle').textContent = '➕ Новый заказ';
  document.getElementById('orderSaveBtn').textContent = '💾 Сохранить заказ';
  document.getElementById('o-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('o-items').value = '';
  document.getElementById('o-weight').value = '';
  document.getElementById('o-kgrate').value = def.kg || '';
  document.getElementById('o-yuan').value = '';
  document.getElementById('o-rate').value = def.rate || '';
  switchScreen('order');
}
function editOrder(personId, orderId) {
  const p = load().find(x => x.id === personId);
  if (!p) return;
  const o = (p.orders||[]).find(x => x.id === orderId);
  if (!o) return;
  currentOrderPersonId = personId;
  currentOrderId = orderId;
  document.getElementById('orderFormTitle').textContent = '✏️ Редактировать заказ';
  document.getElementById('orderSaveBtn').textContent = '💾 Обновить';
  document.getElementById('o-date').value = o.date || '';
  document.getElementById('o-items').value = o.items || '';
  document.getElementById('o-weight').value = o.weight || '';
  document.getElementById('o-kgrate').value = o.kgrate || '';
  document.getElementById('o-yuan').value = o.yuan || '';
  document.getElementById('o-rate').value = o.rate || '';
  switchScreen('order');
}
function saveOrder() {
  const date = document.getElementById('o-date').value;
  const items = document.getElementById('o-items').value.trim();
  const weight = parseFloat(document.getElementById('o-weight').value) || 0;
  const kgrate = parseFloat(document.getElementById('o-kgrate').value) || 0;
  const yuan = parseFloat(document.getElementById('o-yuan').value) || 0;
  const rate = parseFloat(document.getElementById('o-rate').value) || 0;
  if (rate <= 0) { showModal('⚠️ Ошибка','Введите курс юаня больше 0'); return; }

  const data = load();
  const idx = data.findIndex(p => p.id === currentOrderPersonId);
  if (idx < 0) return;
  if (!data[idx].orders) data[idx].orders = [];

  if (currentOrderId) {
    const oIdx = data[idx].orders.findIndex(o => o.id === currentOrderId);
    if (oIdx >= 0) data[idx].orders[oIdx] = { id: currentOrderId, date, items, weight, kgrate, yuan, rate };
  } else {
    data[idx].orders.push({ id: Date.now(), date, items, weight, kgrate, yuan, rate });
  }
  save(data);
  openPerson(currentOrderPersonId);
}
function deleteOrder(personId, orderId) {
  if (!confirm('Удалить заказ?')) return;
  const data = load();
  const idx = data.findIndex(p => p.id === personId);
  if (idx < 0) return;
  data[idx].orders = (data[idx].orders||[]).filter(o => o.id !== orderId);
  save(data);
  openPerson(personId);
}

// ================= ОПЛАТЫ (экран) =================
function setPayFilter(f, btn) {
  payFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPayments();
}
function renderPayments() {
  const data = load();
  const t = calcTotals(data);
  document.getElementById('totalPaid').textContent = t.totalPaid.toFixed(2)+' BYN';
  document.getElementById('totalRemain').textContent = 'Осталось: '+t.totalRemain.toFixed(2)+' BYN';

  let cP=0,cPa=0,cD=0,cO=0;
  data.forEach(p => {
    const c = calcPerson(p);
    if (c.status==='paid') cP++;
    else if (c.status==='partial') cPa++;
    else cD++;
    if (c.overdue) cO++;
  });
  document.getElementById('countPaid').textContent = cP;
  document.getElementById('countPartial').textContent = cPa;
  document.getElementById('countDebt').textContent = cD;
  document.getElementById('countOverdue').textContent = cO;

  let filtered = data;
  if (payFilter==='paid') filtered = data.filter(p => calcPerson(p).status === 'paid');
  if (payFilter==='debt') filtered = data.filter(p => calcPerson(p).status !== 'paid');
  if (payFilter==='overdue') filtered = data.filter(p => calcPerson(p).overdue);

  const el = document.getElementById('paymentsList');
  if (!filtered.length) { el.innerHTML = '<div class="empty">Нет записей</div>'; return; }

  el.innerHTML = filtered.map(p => {
    const c = calcPerson(p);
    let st = 'Должен', cls = c.status;
    if (c.status==='paid') st = '✅ Оплачено';
    else if (c.status==='partial') st = '⚠️ Частично';
    if (c.overdue && c.status !== 'paid') { st = '🔥 Просрочено >30 дней'; cls = 'overdue'; }
    return `<div class="pay-row ${cls}" onclick="openPerson(${p.id})">
      <div class="avatar">${p.avatar}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="status">${st}</div>
      </div>
      <div class="amounts">
        <div class="total">из ${c.total.toFixed(2)}</div>
        <div class="remain">${c.remain.toFixed(2)} BYN</div>
      </div>
    </div>`;
  }).join('');
}

// ================= СТАТИСТИКА =================
function renderStats() {
  const data = load();
  const t = calcTotals(data);
  document.getElementById('statsTotal').textContent = t.totalByn.toFixed(2)+' BYN';
  document.getElementById('statsSub').textContent = '¥'+t.totalYuan.toFixed(2)+' · '+t.totalWeight.toFixed(2)+' кг';
  document.getElementById('sumGoods').textContent = t.goodsByn.toFixed(2);
  document.getElementById('sumDeliv').textContent = t.delivByn.toFixed(2);
  document.getElementById('sumYuan').textContent = '¥'+t.totalYuan.toFixed(2);
  document.getElementById('sumWeight').textContent = t.totalWeight.toFixed(2)+' кг';

  // По месяцам
  const months = {};
  data.forEach(p => (p.orders||[]).forEach(o => {
    if (!o.date) return;
    const m = o.date.slice(0,7);
    const c = calcOrder(o);
    if (!months[m]) months[m] = { total: 0, count: 0 };
    months[m].total += c.total;
    months[m].count++;
  }));

  const monthKeys = Object.keys(months).sort().reverse();
  const maxTotal = Math.max(1, ...monthKeys.map(k => months[k].total));
  const monthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

  document.getElementById('monthlyStats').innerHTML = monthKeys.length ? monthKeys.map(k => {
    const [y, m] = k.split('-');
    const pct = (months[k].total / maxTotal * 100);
    return `<div>
      <div class="month-label">${monthNames[parseInt(m)-1]} ${y} · ${months[k].count} заказ${months[k].count===1?'':'ов'}</div>
      <div class="chart-bar"><div class="fill" style="width:${Math.max(pct,15)}%">${months[k].total.toFixed(0)} BYN</div></div>
    </div>`;
  }).join('') : '<div class="empty" style="padding:20px;font-size:13px;">Пока нет данных</div>';

  // Все заказы
  const allOrders = [];
  data.forEach(p => (p.orders||[]).forEach(o => allOrders.push({ person: p, order: o })));
  allOrders.sort((a,b) => (b.order.date||'').localeCompare(a.order.date||''));

  document.getElementById('allOrders').innerHTML = allOrders.length ? allOrders.slice(0,50).map(x => {
    const c = calcOrder(x.order);
    return `<div class="order-item" onclick="openPerson(${x.person.id})">
      <div class="head">
        <div class="date">${x.order.date ? new Date(x.order.date).toLocaleDateString('ru-RU') : '—'} · ${x.person.avatar} ${escapeHtml(x.person.name)}</div>
        <div class="order-total">${c.total.toFixed(2)} BYN</div>
      </div>
      ${x.order.items ? `<div class="row-small">📦 ${escapeHtml(x.order.items)}</div>` : ''}
    </div>`;
  }).join('') : '<div class="empty" style="padding:20px;font-size:13px;">Заказов нет</div>';
}

// ================= РЕЗЕРВНАЯ КОПИЯ =================
function exportBackup() {
  const data = load();
  const def = loadDefaults();
  const backup = { version: 5, exported: new Date().toISOString(), data, defaults: def };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'uchet-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const b = JSON.parse(e.target.result);
      if (!b.data || !Array.isArray(b.data)) throw new Error('Неверный формат');
      if (!confirm('Заменить все текущие данные? (у тебя '+load().length+' человек, в файле '+b.data.length+')')) return;
      save(b.data);
      if (b.defaults) localStorage.setItem(DEFAULTS_KEY, JSON.stringify(b.defaults));
      location.reload();
    } catch (err) {
      showModal('❌ Ошибка','Не удалось прочитать файл: '+err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function exportCSV() {
  const data = load();
  if (!data.length) { showModal('ℹ️','Нет данных для экспорта'); return; }
  const rows = [['Имя','Телефон','Telegram','Заказов','Вес всего','Юани всего','Товар BYN','Доставка BYN','Итого BYN','Оплачено BYN','Остаток BYN','Статус']];
  data.forEach(p => {
    const c = calcPerson(p);
    const st = c.status==='paid'?'Оплачено':(c.status==='partial'?'Частично':'Долг');
    rows.push([p.name, p.phone||'', p.telegram||'', c.ordersCount, c.weight.toFixed(2), c.yuan.toFixed(2), c.goods.toFixed(2), c.deliv.toFixed(2), c.total.toFixed(2), c.paid.toFixed(2), c.remain.toFixed(2), st]);
  });
  const csv = '\uFEFF' + rows.map(r => r.map(x => '"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'uchet-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ================= ХЕЛПЕРЫ =================
function plural(n, one, few, many) {
  const m10 = n%10, m100 = n%100;
  if (m10===1 && m100!==11) return one;
  if (m10>=2 && m10<=4 && (m100<10 || m100>=20)) return few;
  return many;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ================= PWA =================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// ================= СТАРТ =================
loadTheme();
checkLock();
renderMe();
renderPeople();
renderPayments();
renderStats();
</script>
